spring:
  datasource:
    url: jdbc:h2:mem:global;MODE=MySQL;DATABASE_TO_LOWER=TRUE;CASE_INSENSITIVE_IDENTIFIERS=TRUE;DB_CLOSE_DELAY=-1
    username: sa
    password:
  flyway:
    enabled: true
  jpa:
    hibernate:
      ddl-auto: validate

app:
  jwt:
    # Secreto SOLO de tests (no sensible, >= 32 bytes). Produccion y dev: JWT_SECRET por entorno.
    secret: test-only-jwt-secret-not-for-production-0123456789
    expiration-min: 30
