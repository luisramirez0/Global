spring:
  profiles:
    default: dev
  autoconfigure:
    # Evita que Boot genere (y loguee) una contraseña en memoria (regla 5).
    exclude: org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    locations: classpath:db/migration
  mail:
    host: ${SMTP_HOST:}
    port: ${SMTP_PORT:}
    username: ${SMTP_USER:}
    password: ${SMTP_PASSWORD:}

server:
  port: 8080

app:
  base-url: ${APP_BASE_URL:http://localhost:5173}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
  jwt:
    secret: ${JWT_SECRET:}
    expiration-min: ${JWT_EXPIRATION_MIN:30}
