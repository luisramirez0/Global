spring:
  # Sin perfil por defecto (C-16): un arranque sin SPRING_PROFILES_ACTIVE no activa el seed ni la
  # configuración de desarrollo; falla al no tener base. docker-compose.yml fija `dev` y los tests `test`.
  autoconfigure:
    # Evita que Boot genere (y loguee) una contraseña en memoria (regla 5).
    exclude: org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    # Regla 5: ni SQL ni parametros en logs, en ningun perfil.
    show-sql: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        type:
          preferred_instant_jdbc_type: TIMESTAMP
        query:
          # @Immutable (audit_log): un UPDATE/DELETE HQL sobre la entidad lanza excepcion.
          immutable_entity_update_query_handling_mode: exception
  flyway:
    locations: classpath:db/migration
  mail:
    host: ${SMTP_HOST:}
    port: ${SMTP_PORT:587}
    username: ${SMTP_USER:}
    password: ${SMTP_PASSWORD:}
    properties:
      mail:
        smtp:
          # Timeouts explicitos (ms): sin ellos un SMTP caido bloquea el hilo indefinidamente (C-09, D8).
          connectiontimeout: 10000
          timeout: 10000
          writetimeout: 10000
          # Autenticacion y STARTTLS obligatorio: la contrasena SMTP nunca viaja en texto plano (C-09, regla 12).
          # Solo un SMTP local de desarrollo sin TLS justifica SMTP_STARTTLS=false.
          auth: true
          starttls:
            enable: ${SMTP_STARTTLS:true}
            required: ${SMTP_STARTTLS:true}

logging:
  level:
    # Nunca TRACE: volcaria los parametros enlazados (PII / datos de salud).
    org.hibernate.orm.jdbc.bind: WARN

server:
  port: 8080

app:
  mail:
    # Remitente de los emails de recordatorio. Sin valor: el envio responde SMTP_NO_CONFIGURADO (C-09, D8).
    from: ${SMTP_FROM:}
  base-url: ${APP_BASE_URL:http://localhost:5173}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
  jwt:
    secret: ${JWT_SECRET:}
    expiration-min: ${JWT_EXPIRATION_MIN:30}
  # Admin del seed de desarrollo (solo perfil dev). Sin default para la contrasena: si falta, no se crea.
  dev-admin:
    email: ${DEV_ADMIN_EMAIL:admin@dev.local}
    password: ${DEV_ADMIN_PASSWORD:}
