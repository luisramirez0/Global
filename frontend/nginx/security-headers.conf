# C-16: headers de seguridad para la SPA estática. Se incluye en el contexto `http` de nginx
# (conf.d/*.conf) y lo heredan los server/location que no definen sus propios add_header
# (el default.conf de la imagen nginx:alpine no define ninguno).
# CSP queda fuera del MVP a propósito (ver docs/bugs-conocidos.md): sin probarla en el navegador
# podría bloquear la conexión a la API en otro origen y romper la demo.
server_tokens off;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "no-referrer" always;
